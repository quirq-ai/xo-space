              if a[0] != b[0]:
                  return -1 if a[0] < b[0] else 1
              if a[1] == b[1]:
                  return 0
              if not a[1] or not b[1]:
                  return -1 if a[1] else 1
              for x, y in zip(a[1], b[1]):
