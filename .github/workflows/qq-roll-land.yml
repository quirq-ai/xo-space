              return [(op, lo)]  # >= and <


          def satisfies(version, rng):
              """Whether npm would resolve `rng` to `version`, for the range forms npm documents. Anything else
              (dist-tags, aliases, URLs, git, file:) raises ValueError, so the caller refuses it."""
              for text in (version, rng):
                  # Python and JavaScript disagree on what counts as whitespace beyond space and tab.
                  # Any number near JavaScript's limit (npm also overflows when it bumps one) is refused too.
                  if len(text) > MAX_LENGTH or not re.fullmatch(r"[\x20-\x7e\t]*", text) or \
                          any(len(d) > 15 and int(d) >= MAX_SAFE_INTEGER for d in re.findall(r"[0-9]+", text)):
                      raise ValueError(f"not a range or version npm reads the same way: {text[:40]!r}")
              v = _semver(version)
              if v is None:
                  raise ValueError(f"not a version: {version!r}")
              found = False
              for alt in rng.split("||"):
                  alt = alt.strip()
                  m = re.fullmatch(r"(\S+)\s+-\s+(\S+)", alt)
                  if m:
                      a, b = _partial(m[1]), _partial(m[2])
                      if not a or not b:
                          raise ValueError(f"not a range npm documents: {rng!r}")
                      comps = _comparators(">=", *a) + _comparators("<=", *b)
                  else:
                      comps = []
                      for tok in re.sub(r"(\^|~|>=|<=|>|<|=)\s+(?=[0-9vxX*])", r"\1", alt).split() or ["*"]:
                          m = re.fullmatch(r"(\^|~|>=|<=|>|<|=)?\s*(.+)", tok)
                          operand = _partial(m[2]) if m else None
                          if operand is None:
                              raise ValueError(f"not a range npm documents: {rng!r}")
                          comps += _comparators(m[1] or "", *operand)
                  ok = all({"=": c == 0, ">": c > 0, ">=": c >= 0, "<": c < 0, "<=": c <= 0}[op]
                           for op, cv, _ in comps for c in [_cmp(v, cv)])
                  # A prerelease satisfies a range only if a comparator names a prerelease of the same version.
                  if ok and v[1] and not any(named and cv[0] == v[0] for _, cv, named in comps):
                      ok = False
                  found = found or ok
                  # npm reads a range with an any-version alternative as plain *, which excludes prereleases.
                  if v[1] and all(c[:2] == (">=", ((0, 0, 0), ())) for c in comps):
                      return False
              return found


          def _section(leaves, name):
              """{entry key: {path below the entry: value}} for one top-level section. The entry's own value is
              kept under (), so an entry written as one flow mapping ({dependencies: {...}}) is not lost."""
              out = {}
              for path, value in leaves.items():
                  if path[0] == name and len(path) > 1:
                      out.setdefault(path[1], {})[path[2:]] = value
              return out


          def _odd_entry(entry):
              """Whether an entry is written other than as pnpm writes it: a block mapping, or {} when empty."""
              return entry.get(()) not in (None, "{}") or (entry.get(()) == "{}" and len(entry) > 1)


          def _flow(text):
              """pnpm's flow values ({k: v, ...}, [a, ...], 'quoted' and plain scalars) as dicts, lists and
              strings. Raises ValueError on anything else."""
              text, pos, depth = text.strip(), 0, 0

              def ws():
                  nonlocal pos
                  while text.startswith(" ", pos):
                      pos += 1

              def value(stop):
                  nonlocal pos, depth
                  ws()
                  if text.startswith(("{", "["), pos):
                      depth += 1
                      if depth > 8:
                          raise ValueError("nested too deep")
                  for open_, close in (("{", "}"), ("[", "]")):
                      if text.startswith(open_, pos):
                          pos += 1
                          out = {} if open_ == "{" else []
                          ws()
                          if text.startswith(close, pos):
                              pos += 1
                              depth -= 1
                              return out
                          while True:
                              if open_ == "{":
                                  key = value(":")
                                  if not isinstance(key, str) or not text.startswith(": ", pos) or key in out:
                                      raise ValueError("not a flow mapping")
                                  pos += 1
                                  out[key] = value(",}")
                              else:
                                  out.append(value(",]"))
                              ws()
                              if text.startswith(close, pos):
                                  pos += 1
                                  depth -= 1
                                  return out
                              if not text.startswith(",", pos):
                                  raise ValueError("not a flow collection")
                              pos += 1
                  if text.startswith("'", pos):
                      m = re.compile(r"'((?:[^']|'')*)'").match(text, pos)
                      if not m:
                          raise ValueError("unterminated quote")
                      pos = m.end()
                      return m[1].replace("''", "'")
                  start = pos
                  while pos < len(text) and text[pos] not in stop:
                      pos += 1
                  if not text[start:pos].strip():
                      raise ValueError("empty value")
                  return text[start:pos].strip()

              out = value("")
              if pos != len(text):
                  raise ValueError("trailing text")
              return out


          def _package_fields(entry):
              """An added package entry's fields other than resolution, as pnpm-written values."""
              out = {}
              for path, value in entry.items():
                  if not path or path[0] == "resolution" or value is None:
                      continue
                  if path[0] == "bundledDependencies" and path[1:] == ("-",):
                      out[path[0]] = [_flow(line) for line in value.splitlines()]
                  elif len(path) == 1:
                      out[path[0]] = _flow(value)
                  else:
                      out.setdefault(path[0], {})
                      node = out[path[0]]
                      for part in path[1:-1]:
                          node = node.setdefault(part, {})
                      node[path[-1]] = _flow(value)
              return out


          def _expected_fields(meta):
              """What pnpm writes in a package entry for a registry manifest, beside resolution."""
              out = {f: meta[f] for f in ("engines", "os", "cpu", "libc", "deprecated") if meta.get(f)}
              if meta.get("bin") or (meta.get("directories") or {}).get("bin"):
                  out["hasBin"] = "true"
              peers = dict(meta.get("peerDependencies") or {})
              for name in meta.get("peerDependenciesMeta") or {}:  # an optional peer with no range is any version
                  peers.setdefault(name, "*")
              if peers:
                  out["peerDependencies"] = peers
              if meta.get("peerDependenciesMeta"):
                  out["peerDependenciesMeta"] = {n: {k: json.dumps(v) if isinstance(v, bool) else v for k, v in d.items()}
                                                 for n, d in meta["peerDependenciesMeta"].items()}
              bundled = meta.get("bundleDependencies") or meta.get("bundledDependencies")
              if bundled:
                  out["bundledDependencies"] = bundled
              return out


          def _edges(entry):
              """(kind, name, value) for a snapshot's plain edges; kind is dependencies or optionalDependencies."""
              return [(path[0], path[1], value) for path, value in entry.items()
                      if len(path) == 2 and path[0] in ("dependencies", "optionalDependencies")]


          def _target(name, value):
              """The snapshot key an edge or importer version points at: `name@value`, or the value itself for an
              alias (pnpm writes `foo: is-number@7.0.0` for "foo": "npm:is-number@7.0.0")."""
              return value if _SNAPSHOT_KEY.fullmatch(value) and not _split_version(value) else f"{name}@{value}"


          def _walk(snapshots, starts, required_only=False):
              """Snapshot keys reachable from `starts` (following only non-optional edges if asked)."""
              seen, todo = set(), list(starts)
              while todo:
                  key = todo.pop()
                  if key in seen:
                      continue
                  seen.add(key)
                  for kind, name, value in _edges(snapshots.get(key, {})):
                      if not (required_only and kind == "optionalDependencies"):
                          todo.append(_target(name, value))
              return seen


          def _package_of(snapshot_key):
              m = _SNAPSHOT_KEY.fullmatch(snapshot_key)
              return f"{m[1]}@{m[2]}" if m else None


          def tree_problems(shown, old, new, dep, prev, new_version, roots, registry):
              """What the packages and snapshots sections change beyond `dep`'s new closure (see above).
              `old` and `new` are lock_leaves results; `roots` the snapshot keys of importer entries the roll
              changed; `registry(name, version)` returns that version's registry manifest or raises."""
              out = []
              old_p, new_p = _section(old, "packages"), _section(new, "packages")
              old_s, new_s = _section(old, "snapshots"), _section(new, "snapshots")
              added_p = sorted(set(new_p) - set(old_p))
              added_s = sorted(set(new_s) - set(old_s))
              if len(added_p) + len(added_s) > MAX_ADDED:
                  return [f"{shown}: adds {len(added_p) + len(added_s)} lockfile entries, more than {MAX_ADDED} checked"]

              # Reachability first, so nothing unreachable costs a registry request.
              starts = [_target(path[3], value) for path, value in new.items()
                        if len(path) == 5 and path[0] == "importers" and path[4] == "version" and value]
              seen = _walk(new_s, [r for r in roots if r in new_s])
              required = _walk(new_s, [_target(path[3], value) for path, value in new.items()
                                       if len(path) == 5 and path[0] == "importers" and path[2] != "optionalDependencies"
                                       and path[4] == "version" and value], required_only=True)
              reached = {_package_of(k) for k in seen} - {None}
              unreachable = {k for k in added_p if k not in reached} | {k for k in added_s if k not in seen}
              for key in sorted(unreachable):
                  out.append(f"{shown}: added entry {json.dumps(key)} is not in the bumped dependency's closure")

              # Nothing removed may still be in use: walk from every importer entry of the new lockfile.
              in_use = _walk(new_s, starts)
              for key in sorted(set(old_s) - set(new_s)):
                  if key in in_use:
                      out.append(f"{shown}: removes the snapshot {json.dumps(key)}, which is still in use")
              in_use_p = {_package_of(k) for k in in_use}
              for key in sorted(set(old_p) - set(new_p)):
                  if key in in_use_p:
                      out.append(f"{shown}: removes the package {json.dumps(key)}, which is still in use")

              manifests = {}

              def manifest(name, version):
                  if (name, version) not in manifests:
                      try:
                          manifests[(name, version)] = registry(name, version)
                      except Exception as e:
                          manifests[(name, version)] = e
                  found = manifests[(name, version)]
                  if isinstance(found, Exception):
                      raise found
                  return found

              for key in sorted(set(old_p) & set(new_p)):
                  if old_p[key] != new_p[key]:
                      out.append(f"{shown}: changes the existing package {json.dumps(key)}")
              for key in added_p:
                  if key in unreachable:
                      continue
                  m = _PKG_KEY.fullmatch(key)
                  fields = {path[0] for path in new_p[key] if path}
                  resolution = _RESOLUTION.fullmatch(new_p[key].get(("resolution",)) or "")
                  if not m or _odd_entry(new_p[key]) or not fields <= PACKAGE_FIELDS or not resolution:
                      out.append(f"{shown}: added package {json.dumps(key)} is not a registry package entry")
                      continue
                  try:
                      meta = manifest(m[1], m[2])
                  except Exception as e:
                      out.append(f"{shown}: could not check {json.dumps(key)} against the registry ({type(e).__name__})")
                      continue
                  if (meta.get("dist") or {}).get("integrity") != resolution[1]:
                      out.append(f"{shown}: added package {json.dumps(key)} does not have the registry's integrity")
                      continue
                  # A field written must say what the registry says. pnpm may leave out libc, deprecated and the
                  # peer fields (some versions drop libc), but not what decides whether and how it installs.
                  try:
                      expected, written = _expected_fields(meta), _package_fields(new_p[key])
                      same = all(expected.get(f) == v for f, v in written.items()) and \
                          all(f in written for f in REQUIRED_FIELDS & set(expected))
                  except Exception:  # a field this cannot read is refused, never a crash
                      same = False
                  if not same:
                      out.append(f"{shown}: added package {json.dumps(key)} has fields its registry manifest does not")

              for key in sorted(k for k in new_s if k not in unreachable and (k not in old_s or old_s[k] != new_s[k])):
                  m = _SNAPSHOT_KEY.fullmatch(key)
                  fields = {path[0] for path in new_s[key] if path}
                  if not m or _odd_entry(new_s[key]) or not fields <= SNAPSHOT_FIELDS or f"{m[1]}@{m[2]}" not in new_p:
                      out.append(f"{shown}: snapshot {json.dumps(key)} is not a snapshot of a package in the lockfile")
                      continue
                  if key in old_s:
                      moved = {path for path in set(old_s[key]) | set(new_s[key])
                               if old_s[key].get(path) != new_s[key].get(path)}
                      was = {path: _split_version(old_s[key].get(path)) for path in moved}
                      now = {path: _split_version(new_s[key].get(path)) for path in moved}
                      if any(len(path) != 2 or path[0] not in ("dependencies", "optionalDependencies") or path[1] != dep
                             or not was[path] or not now[path] or was[path][0] != prev or now[path][0] != new_version
                             for path in moved):
                          out.append(f"{shown}: changes the existing snapshot {json.dumps(key)} beyond moving its edge to "
                                     f"{json.dumps(dep)} from {json.dumps(prev)} to {json.dumps(new_version)}")
                          continue
                  elif new_s[key].get(("optional",)) is not None and (new_s[key][("optional",)] != "true" or key in required):
                      out.append(f"{shown}: snapshot {json.dumps(key)} is marked optional but is not an optional dependency")
                      continue
                  try:
                      meta = manifest(m[1], m[2])
                  except Exception as e:
                      out.append(f"{shown}: could not check {json.dumps(key)} against the registry ({type(e).__name__})")
                      continue
                  optional = meta.get("optionalDependencies") or {}
                  declared = {"dependencies": {}, "optionalDependencies": {}}
                  for name, rng in (meta.get("dependencies") or {}).items():
                      if name not in optional:  # npm also lists optional dependencies under dependencies
                          declared["dependencies"].setdefault(name, []).append(rng)
                  for name, rng in optional.items():
                      declared["optionalDependencies"].setdefault(name, []).append(rng)
                  for name, rng in (meta.get("peerDependencies") or {}).items():
                      declared["dependencies"].setdefault(name, []).append(rng)
                  for name, info in (meta.get("peerDependenciesMeta") or {}).items():
                      # An optional peer with no range is any version; pnpm lists a resolved optional peer under
                      # dependencies or optionalDependencies, depending on its version.
                      rng = (meta.get("peerDependencies") or {}).get(name, "*")
                      if name not in (meta.get("peerDependencies") or {}):
                          declared["dependencies"].setdefault(name, []).append(rng)
                      if (info or {}).get("optional") is True:
                          declared["optionalDependencies"].setdefault(name, []).append(rng)
                  for path, value in new_s[key].items():
                      if not path or path[0] not in ("dependencies", "optionalDependencies") or (len(path) == 1 and value is None):
                          continue
                      target = _split_version(value) if len(path) == 2 else None
                      ranges = declared[path[0]].get(path[-1], [])
                      try:
                          fits = target and any(satisfies(target[0], r) for r in ranges)
                      except Exception:  # a range this cannot read is refused, never a crash
                          fits = False
                      if not fits or f"{path[1]}@{value}" not in new_s:
                          out.append(f"{shown}: snapshot {json.dumps(key)} has an edge {json.dumps(path[-1])}: "
                                     f"{json.dumps(value)} its registry manifest does not allow")
              return out


          def problems(env, files, commits, rules, allowed, head_rules, locks, registry=None):
              """Why the roll is not clean; empty when it is. `locks` maps each changed npm-lock file to its
              (merge base, head) contents."""
              out = []
              if env.get("SENDER") != DEPENDABOT or env.get("TRIGGER") != DEPENDABOT:
                  out.append(f"triggered by {env.get('SENDER')!r}/{env.get('TRIGGER')!r}, not Dependabot")

              # Exactly one commit, made by Dependabot through GitHub (committer web-flow, signed by GitHub).
              # Author emails can be set by anyone, so the committer and the event sender carry the trust.
              if len(commits) != 1:
                  out.append(f"{len(commits)} commits; a Dependabot roll has exactly one")
              for c in commits:
                  author = (c.get("author") or {}).get("login")
                  committer = (c.get("committer") or {}).get("login")
                  verified = ((c.get("commit") or {}).get("verification") or {}).get("verified") is True
                  if (author, committer, verified) != (DEPENDABOT, "web-flow", True):
                      out.append(f"commit {c.get('sha', '?')[:12]}: author {author!r}, committer {committer!r}, "
                                 f"verified {verified}; not a GitHub-made Dependabot commit")

              try:
                  changed = int(env.get("CHANGED", ""))
              except ValueError:
                  changed = -1
              if changed != len(files) or not 0 < changed <= MAX_FILES:
                  out.append(f"the PR changes {changed} files and {len(files)} were listed (at most {MAX_FILES})")
              dep_names = [d.strip() for d in env.get("DEP_NAMES", "").split(",") if d.strip()]
              deps = {kind: {dep_name(kind, d) for d in dep_names} for kind in LINE_RULES}
              for f in files:
                  filename = f.get("filename", "")
                  shown = json.dumps(filename)
                  if f.get("status") != "modified" or f.get("previous_filename"):
                      out.append(f"{shown}: {f.get('status')} (only modified files, no renames)")
                      continue
                  kinds = [kind for glob, kind in allowed if matches(filename, glob)]
                  if not kinds:
                      out.append(f"{shown}: not a dependency file")
                      continue
                  patch = f.get("patch")
                  if not patch:
                      out.append(f"{shown}: no diff to check (too large or binary)")
                      continue
                  keys = {"+": [], "-": []}
                  for sign, line in changed_lines(patch):
                      # pip and other readers split lines on these too, so one could hide a second line in this one.
                      if CONTROL.search(line):
                          out.append(f"{shown}: control or line-separator character in a changed line: "
                                     f"{json.dumps(line.strip())[:100]}")
                          continue
                      if kinds[0] == "npm-lock":
                          if sign == "+" and LOCK_FORBIDDEN.search(line.replace("'", "")):  # quoted keys too
                              out.append(f"{shown}: non-registry resolution: {json.dumps(line.strip())[:100]}")
                          continue
                      m = LINE_RULES[kinds[0]].match(line)
                      if not m:
                          out.append(f"{shown}: not a version line: {json.dumps(line.strip())[:100]}")
                      else:
                          keys[sign].append(entry(kinds[0], m))
                  # A bump rewrites existing entries in place: the same entries go out and come back in, with only
                  # their version numbers changed, and only for the dependency the PR says it bumps.
                  if sorted(keys["+"]) != sorted(keys["-"]):
                      out.append(f"{shown}: adds, removes or reshapes entries, not only versions")
                  if kinds[0] == "npm-lock":
                      if filename not in locks:
                          out.append(f"{shown}: lockfile contents were not read")
                      elif len(dep_names) != 1:
                          out.append(f"{shown}: a lockfile is checked only for a roll of exactly one dependency")
                      else:
                          out += lock_problems(shown, *locks[filename], dep_names[0], env.get("PREV_VERSION", "").strip(),
                                               env.get("NEW_VERSION", "").strip(), registry)
                  others = sorted({n for n, _ in keys["+"] + keys["-"]} - deps.get(kinds[0], set()))
                  if others:
                      out.append(f"{shown}: changes {json.dumps(others)[:100]}, not the bumped dependency")

              # Only patch and minor bumps of one dependency; a 0.x minor bump can break, so it counts as major.
              update = env.get("UPDATE_TYPE", "")
              if update not in ("version-update:semver-patch", "version-update:semver-minor"):
                  out.append(f"update type {update!r}; only patch and minor bumps land alone")
              if "," in env.get("DEP_NAMES", ""):
                  out.append("several dependencies in one PR")
              # Semver: below 1.0 a minor bump can break, and below 0.1 even a patch bump can. Unknown counts as 0.x.
              prev = env.get("PREV_VERSION", "").strip().lstrip("vV")
              if update == "version-update:semver-minor" and (not prev or prev.startswith("0.")):
                  out.append(f"minor bump from {env.get('PREV_VERSION')!r}; 0.x minors can break, so a human lands it")
              if update == "version-update:semver-patch" and (not prev or prev == "0.0" or prev.startswith("0.0.")):
                  out.append(f"patch bump from {env.get('PREV_VERSION')!r}; 0.0.x patches can break, so a human lands it")

              # Auto-merge waits for required checks only if there are some that a workflow cannot fake: a
              # required check bound to an app other than GitHub Actions, or a required workflow (ruleset).
              bound = [check for r in rules if r.get("type") == "required_status_checks"
                       for check in (r.get("parameters") or {}).get("required_status_checks", [])
                       if type(check.get("integration_id")) is int and check["integration_id"] > 0
                       and check["integration_id"] != GITHUB_ACTIONS_APP]
              # A required workflow counts only if every workflow in the rule is pinned to a commit, so nobody with
              # push access can edit what it runs.
              workflows = [r for r in rules if r.get("type") == "workflows"
                           and (r.get("parameters") or {}).get("workflows")
                           and all(isinstance(w, dict) and re.fullmatch(r"[0-9a-f]{40}", str(w.get("sha", "")))
                                   for w in r["parameters"]["workflows"])]
              if not bound and not workflows:
                  out.append("no required workflow pinned by sha, and no required check bound to an app other than "
                             "GitHub Actions, on the base branch; any workflow could fake the gate, so a human lands it")

              # Auto-merge stays on after this run, so nobody but Dependabot may push to the PR branch afterwards.
              # (Who is exempt from these rules is not readable here; that part is on the admin.)
              head_types = {r.get("type") for r in head_rules}
              if not {"update", "non_fast_forward"} <= head_types:
                  out.append(f"the PR branch has no update and non_fast_forward rules (has {sorted(map(str, head_types))}); "
                             "anyone with push access could swap its commit after this check, so a human lands it")
              return out


          def gh(*args):
              return subprocess.run(["gh", "api", *args], check=True, capture_output=True, text=True).stdout


          def read_locks(env, files, allowed):
              """(merge base, head) contents of each changed npm-lock file, read whole through the contents API."""
              names = [f.get("filename", "") for f in files
                       if any(kind == "npm-lock" and matches(f.get("filename", ""), glob) for glob, kind in allowed)]
              if not names:
                  return {}
              repo, head = env["GITHUB_REPOSITORY"], env["HEAD_SHA"]
              base = gh(f"repos/{repo}/compare/{env['BASE_SHA']}...{head}", "--jq", ".merge_base_commit.sha").strip()
              for sha in (base, head):
                  if not re.fullmatch(r"[0-9a-f]{40}", sha):
                      raise ValueError(f"not a commit sha: {sha!r}")
              raw = ("-H", "Accept: application/vnd.github.raw+json")
              return {name: tuple(gh(*raw, f"repos/{repo}/contents/{urllib.parse.quote(name)}?ref={sha}")
                                  for sha in (base, head)) for name in names}


          def npm_registry(name, version):
              """A version's manifest from the public npm registry. Raises on any error, so the roll is refused."""
              import urllib.request
              if not (re.fullmatch(_PKG_NAME, name) and re.fullmatch(_VERSION, version)):
                  raise ValueError("not a package name and version")
              url = "https://registry.npmjs.org/" + urllib.parse.quote(name, safe="@") + "/" + urllib.parse.quote(version)
              class NoRedirects(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self, *args, **kwargs):
                      raise ValueError("the registry redirected")

              req = urllib.request.Request(url, headers={"Accept": "application/json"})
              with urllib.request.build_opener(NoRedirects).open(req, timeout=30) as resp:
                  if resp.geturl() != url:
                      raise ValueError("the registry redirected")
                  data = json.load(resp)
              if data.get("name") != name or data.get("version") != version:
                  raise ValueError("the registry answered for another package")
              return data


          def main():
              env = os.environ
              d = env["QQ_DIR"]
              files, allowed = pages(f"{d}/files.json"), json.loads(env["QQ_ALLOWED"])
              found = problems(env, files, pages(f"{d}/commits.json"), pages(f"{d}/rules.json"),
                               allowed, pages(f"{d}/head_rules.json"), read_locks(env, files, allowed), npm_registry)
              for p in found:
                  print(f"not clean: {p}")
              if not found:
                  print("clean: lands once the required checks pass")
              with open(env["GITHUB_OUTPUT"], "a") as out:
                  out.write(f"clean={'false' if found else 'true'}\n")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          QQ_LAND_CHECK
      - name: land through the gate
        id: land
        if: steps.clean.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"  # TODO(suraj): squash or merge commits (plan §10.3)
      - name: leave anything else to a human
        if: always() && steps.land.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --disable-auto "$PR_URL" || true  # fails harmlessly when auto-merge is off
