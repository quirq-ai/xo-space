    branches: ["main"]
  merge_group:
permissions:
  contents: read
  pull-requests: read  # the gate timing step reads the PR timeline
concurrency:
  group: "qq-xo-space-presubmit-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  xo-space-presubmit:
    runs-on: "ubuntu-24.04"
