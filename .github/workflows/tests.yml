# CI for every pull request into main (and development), plus pushes to them.
#
# Runs what CONTRIBUTING.md § "Testing and validation" asks a contributor to
# run by hand, so a green check here means the same thing as a green local
# run: the full pytest suite, the import gate + route-parity invariant across
# every agent runtime, the two shell-script harnesses, the plugin-bundle sync
# check, and a syntax pass over the build-free Space UI modules.
#
# Supersedes the approach in fork PR #69, which ran `unittest discover` with
# only requirements.txt installed; tests/test_schemas.py needs jsonschema from
# requirements-dev.txt, and pytest is the runner requirements-dev.txt pins.
#
# Ubuntu only: the watcher needs fcntl (Windows is WSL-only by policy).
# Python 3.12 matches the Dockerfile base image.

name: tests

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/python -m pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: Test suite (pytest)
        run: venv/bin/python -m pytest -q -p no:cacheprovider

      - name: Import gate + route parity (every agent runtime)
        run: venv/bin/python scripts/check_route_parity.py

      - name: install.sh harness
        run: bash tests/install_sh_harness.sh

      - name: uninstall.sh harness
        run: bash tests/uninstall_sh_harness.sh

      - name: Plugin bundles in sync
        run: bash scripts/check_plugin_sync.sh

      - name: Space UI syntax (no build step, so no compiler catches these)
        run: |
          failed=0
          while IFS= read -r f; do
            node --check "$f" || failed=1
          done < <(find space_ui/js -name '*.js')
          exit $failed
