name: quirq-local

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    working_dir: /app
    command: python server.py
    ports:
      - "127.0.0.1:5003:5002"
    environment:
      HOST: "0.0.0.0"
      PORT: "5002"
      STAGE: "local"
      UVICORN_RELOAD: "true"
      STARTUP_WARMUP_URL: "http://127.0.0.1:5002"
      XO_PROJECTS_ROOT: "/workspace/xo-projects"
      AI_WORKSPACE_ROOT: "/workspace/xo-projects"
      QUIRQ_STATE_ROOT: "/root/.quirq"
      # The Composio store defaults to ~/.config/composio, which is not mounted —
      # point it inside the state root so proxy tokens survive `compose down`.
      COMPOSIO_STORE_DIR: "/root/.quirq/composio"
      QUIRQ_RUNTIME_FILE: "/root/.quirq/runtime.env"
      QUIRQ_SECRETS_FILE: "/root/.quirq/secrets.env"
      QUIRQ_WATCHER_SOURCE_MODE: "all"
      QUIRQ_HOST_HOME: "${HOME}"
      QUIRQ_HOST_PROJECTS_ROOT: "${XO_PROJECTS_ROOT:-${HOME}/xo-projects}"
      QUIRQ_HOST_STATE_ROOT: "${HOME}/.quirq"
      QUIRQ_PUBLIC_URL: "http://localhost:5003"
      QUIRQ_MANAGED_CONTAINER: "true"
      QUIRQ_ALLOW_SELF_RESTART: "true"
    volumes:
      - .:/app
      - /app/venv
      - "${XO_PROJECTS_ROOT:-${HOME}/xo-projects}:/workspace/xo-projects"
      - "${HOME}/.quirq:/root/.quirq"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 15s
