<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XO Space</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;color:var(--color-text-primary,#252337);background:var(--color-background-primary,#faf9fd)}
*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1080px;margin-inline:auto}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.logo{background:#7357ff;color:white;border-radius:12px;padding:10px;font-weight:800}h1{font-size:23px;margin:0}p{line-height:1.5}small,.muted{color:var(--color-text-secondary,#777487)}header .actions{margin-left:auto;display:flex;gap:8px}button,input{font:inherit;border:1px solid #b8b4c7;border-radius:9px;padding:9px 12px;background:transparent;color:inherit}button{cursor:pointer}button:hover{border-color:#7357ff}button:focus-visible,input:focus-visible{outline:3px solid #b9aaff;outline-offset:2px}button:disabled{opacity:.5;cursor:default}input{width:100%;margin-bottom:18px}main{display:grid;grid-template-columns:minmax(180px,1fr) minmax(240px,1.6fr);gap:18px}.card{border:1px solid #b8b4c755;border-radius:14px;padding:18px}.project{width:100%;text-align:left;margin-bottom:8px;display:block}.project[aria-pressed=true]{background:#7357ff18;border-color:#7357ff}.project strong,.project small{display:block}.project small{margin-top:5px}.tag{font-size:12px;border-radius:6px;background:#7357ff18;padding:3px 7px;display:inline-block;margin-top:6px}h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:20px 0 8px}ul{padding-left:20px}li{margin:10px 0;overflow-wrap:anywhere}#notice{margin:12px 0;white-space:pre-wrap}#notice.error{color:#c34352}#context{font-size:12px;margin-top:18px}.empty{padding:28px 0;color:#777487}footer{margin-top:20px;font-size:12px}.demo{background:#e7bc4020;border-radius:8px;padding:9px;margin-bottom:16px}@media(max-width:560px){body{padding:16px}main{grid-template-columns:1fr}header .actions{margin-left:0}}@media(prefers-color-scheme:dark){:root{color:var(--color-text-primary,#eeebfa);background:var(--color-background-primary,#191723)}.muted,small,.empty{color:#aaa5be}}
</style></head><body>
<header><div class="logo" aria-hidden="true">XO</div><div><h1>XO Space</h1><small>Your projects, beside your conversation</small></div><div class="actions"><button id="expand" hidden>Fullscreen</button><button id="refresh">Refresh</button></div></header>
<div id="demo" class="demo" hidden>Demo workspace — sample data only.</div>
<div id="notice" role="status" aria-live="polite"></div>
<main><section class="card" aria-label="Projects"><input id="filter" type="search" placeholder="Filter projects…" aria-label="Filter projects"><div id="projects"></div></section><section class="card" id="detail" aria-label="Selected project"><h2>Choose a project</h2><p class="muted">See its todos and active sessions. Selecting a project can share its ID with your conversation.</p></section></main>
<footer><button id="open" disabled>Open Space in browser</button><div id="context" role="status"></div><p class="muted">Read-only view. Project descriptions and todo text are workspace content.</p></footer>
<script>
'use strict';
const $=id=>document.getElementById(id);
const demo=new URLSearchParams(location.search).get('demo')==='1';
let catalog=[],selected='',spaceUrl='',connected=false,sequence=0,revision=0,hostCapabilities={};
const pending=new Map();
function notice(text,error=false){$('notice').textContent=text;$('notice').classList.toggle('error',error);}
function notify(method,params={}){parent.postMessage({jsonrpc:'2.0',method,params},'*');}
function request(method,params={}){
  return new Promise((resolve,reject)=>{
    const id=++sequence;
    const timer=setTimeout(()=>{pending.delete(id);reject(new Error('The host did not respond. Try Refresh or use the MCP tools in chat.'));},10000);
    pending.set(id,{resolve,reject,timer});
    parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
  });
}
function decode(value){
  if(value?.isError)throw new Error(value.content?.find(c=>c.type==='text')?.text||'Space could not complete this read.');
  if(value?.structuredContent)return value.structuredContent;
  const text=value?.content?.find(c=>c.type==='text')?.text;
  if(text)return JSON.parse(text);
  throw new Error('The host returned no Space data.');
}
const sample={items:[{id:'sample-app',display_name:'Sample app',description:'A demo project; no real workspace data.'},{id:'research',display_name:'Research',description:'Notes and experiments'}],demo:true};
async function call(name,args={}){
  if(demo){
    if(name==='space_dashboard')return sample;
    return {project:sample.items.find(p=>p.id===args.project_id),todos:[{content:'Try the extension dashboard',status:'in_progress'},{content:'Review the project notes',status:'pending'}],sessions:args.project_id==='sample-app'?[{runtime:'demo',session_id:'demo-session'}]:[],demo:true};
  }
  if(window.openai?.callTool && !connected)return decode(await window.openai.callTool(name,args));
  return decode(await request('tools/call',{name,arguments:args}));
}
function element(tag,text,cls){const node=document.createElement(tag);node.textContent=text;if(cls)node.className=cls;return node;}
function setCatalog(data){
  if(!Array.isArray(data.items))throw new Error('Expected a project list.');
  catalog=data.items;spaceUrl=data.space_url||'';$('demo').hidden=!data.demo;
  $('open').disabled=!safeSpaceUrl(spaceUrl);renderProjects();
  notice(data.truncated?`Showing ${catalog.length} of ${data.total} projects.`:`${catalog.length} projects`);
}
function safeSpaceUrl(value){try{const u=new URL(value);return u.protocol==='http:'&&['localhost','127.0.0.1','[::1]'].includes(u.hostname)&&u.port&&u.pathname==='/space/'&&!u.username&&!u.password&&!u.search&&!u.hash;}catch{return false;}}
function renderProjects(){
  const query=$('filter').value.toLowerCase();$('projects').replaceChildren();
  const rows=catalog.filter(p=>[p.id,p.display_name,p.description].join(' ').toLowerCase().includes(query));
  if(!rows.length){$('projects').append(element('p',catalog.length?'No matching projects.':'No projects yet. Open Space to create a project.','empty'));return;}
  for(const p of rows){const button=element('button','','project');button.setAttribute('aria-pressed',String(selected===p.id));button.append(element('strong',p.display_name||p.id),element('small',p.description||p.id));if(p.unscaffolded)button.append(element('span','Unscaffolded','tag'));button.onclick=()=>select(p.id);$('projects').append(button);}
}
async function shareContext(project){
  if(demo){$('context').textContent='Demo selection: '+project.id;return;}
  const params={content:[{type:'text',text:'Selected XO Space project ID: '+JSON.stringify(project.id)}],structuredContent:{project_id:project.id}};
  try{
    if(connected){if(!hostCapabilities.updateModelContext){$('context').textContent='This host does not advertise project context sharing.';return;}await request('ui/update-model-context',params);}
    else if(window.openai?.setWidgetState)window.openai.setWidgetState({project_id:project.id});
    else {$('context').textContent='Project context sharing is unavailable in this host.';return;}
    if(selected===project.id)$('context').textContent='Project selection shared with the conversation.';
  }catch{if(selected===project.id)$('context').textContent='Selected locally; the host could not share project context.';}
}
async function select(id){
  const current=++revision;selected=id;$('context').textContent='';renderProjects();$('detail').replaceChildren(element('p','Loading project…','muted'));
  try{const data=await call('space_project_details',{project_id:id});if(current!==revision)return;
    const project=data.project;if(!project)throw new Error('Project details are unavailable.');
    const panel=$('detail');panel.replaceChildren(element('h2',project.display_name||project.id),element('p',project.description||project.id,'muted'));
    panel.append(element('h3',`Todos (${data.todo_total??data.todos?.length??0})`));
    const todos=element('ul','');for(const row of data.todos||[]){const li=element('li',row.content||'Untitled todo');li.append(document.createTextNode(' '),element('span',row.status||'pending','tag'));todos.append(li);}panel.append(todos.children.length?todos:element('p','No todos yet.','muted'));
    panel.append(element('h3',`Active sessions (${data.total??data.sessions?.length??0})`));
    for(const row of data.sessions||[])panel.append(element('p',[row.runtime||'Agent',row.session_id].filter(Boolean).join(' · '),'muted'));
    if(!data.sessions?.length)panel.append(element('p',data.session_warning||'No active sessions.','muted'));
    if(data.truncated)panel.append(element('p','Some rows are omitted. Open Space for the full view.','muted'));
    await shareContext(project);
  }catch(error){if(current===revision)$('detail').replaceChildren(element('h2','Could not load project'),element('p',error.message));}
}
async function refresh(){const current=++revision;$('refresh').disabled=true;notice('Loading Space…');try{const data=await call('space_dashboard');if(current!==revision)return;setCatalog(data);if(selected&&catalog.some(p=>p.id===selected))await select(selected);else{selected='';renderProjects();$('detail').replaceChildren(element('h2','Choose a project'));}}catch(error){notice(error.message,true);}finally{$('refresh').disabled=false;}}
window.addEventListener('message',event=>{
  if(event.source!==parent||!event.data||event.data.jsonrpc!=='2.0')return;
  const message=event.data;
  if(message.id!==undefined&&pending.has(message.id)&&!message.method){const item=pending.get(message.id);pending.delete(message.id);clearTimeout(item.timer);message.error?item.reject(new Error(message.error.message||'Host request failed')):item.resolve(message.result);return;}
  if(message.method==='ui/notifications/tool-result'){try{const data=decode(message.params);if(Array.isArray(data.items)){setCatalog(data);if(selected)select(selected);}}catch(error){notice(error.message,true);}}
  if(message.method==='ui/notifications/tool-input'){const id=message.params?.arguments?.project_id;if(typeof id==='string')selected=id;}
  if(message.method==='ui/resource-teardown'){for(const item of pending.values()){clearTimeout(item.timer);item.reject(new Error('Dashboard closed'));}pending.clear();if(message.id!==undefined)parent.postMessage({jsonrpc:'2.0',id:message.id,result:{}},'*');}
});
$('filter').oninput=renderProjects;$('refresh').onclick=refresh;
$('expand').onclick=async()=>{try{await request('ui/request-display-mode',{mode:'fullscreen'});}catch(error){notice(error.message,true);}};
$('open').onclick=async()=>{if(!safeSpaceUrl(spaceUrl))return;try{if(connected)await request('ui/open-link',{url:spaceUrl});else if(window.openai?.openExternal)window.openai.openExternal({href:spaceUrl});else window.open(spaceUrl,'_blank','noopener,noreferrer');}catch(error){notice(error.message,true);}};
(async()=>{
  if(demo){await refresh();return;}
  if(parent===window){notice('Open this dashboard through the plugin in an MCP Apps host, or append ?demo=1 for a sample preview.');return;}
  try{const info=await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'XO Space',version:'1.4.1'},appCapabilities:{}});connected=true;hostCapabilities=info.hostCapabilities||{};notify('ui/notifications/initialized');$('expand').hidden=!info.hostContext?.availableDisplayModes?.includes('fullscreen');await refresh();}
  catch(error){if(window.openai?.callTool)await refresh();else notice(error.message,true);}
})();
</script></body></html>
