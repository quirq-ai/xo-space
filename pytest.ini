; pytest configuration.
;
; Deliberately a standalone pytest.ini rather than a
; [tool.pytest.ini_options] block in a pyproject.toml: this repo has no
; pyproject, and `unittest discover -s tests` is the primary gate. A file
; only pytest reads cannot change what unittest discovers, which is the
; property that matters — every test in tests/ is a plain
; unittest.TestCase and must run identically under both runners:
;
;   venv/bin/python -m unittest discover -s tests    # the gate
;   venv/bin/python -m pytest -q                     # syncplan §14
;
; Both `venv/bin/pytest` and `venv/bin/python -m pytest` work from the repo
; root: tests/ is a package, so pytest puts the rootdir on sys.path and
; `import services...` resolves the same way it does under unittest.
[pytest]
testpaths = tests
python_files = test_*.py
